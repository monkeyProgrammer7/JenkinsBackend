# Configuración del análisis de SonarQube (la lee sonar-scanner automáticamente)
# La URL del servidor y el token los inyecta Jenkins con withSonarQubeEnv

# Identificador único del proyecto en SonarQube (si cambia, se crea un proyecto nuevo)
sonar.projectKey=telemetria-backend
# Nombre visible en SonarQube ("Telemetría Backend"; í es la í)
sonar.projectName=Telemetría Backend
sonar.sourceEncoding=UTF-8

# Código de la aplicación a analizar
sonar.sources=src

# Pruebas: están en test/, separadas del código, así que no hace falta excluirlas de sources
sonar.tests=test

# Reporte de cobertura generado por `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
